name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e ".[datetime,gui]"

      - name: Check tag matches package version
        shell: bash
        run: |
          PKG=$(python -c "import pcappuller; print(pcappuller.__version__)")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pcappuller.__version__ $PKG" >&2
            exit 1
          fi

      - name: Build GUI binary
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release
          if [ "$RUNNER_OS" = "Windows" ]; then
            pyinstaller --onefile --windowed --name PCAPpullerGUI gui_pcappuller.py
            mv dist/PCAPpullerGUI.exe "release/PCAPpullerGUI-windows.exe"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            # Build a proper .app so Finder runs it correctly
            pyinstaller --windowed --name PCAPpullerGUI gui_pcappuller.py
            (cd dist && zip -r ../release/PCAPpullerGUI-macos.zip PCAPpullerGUI.app)
          else
            pyinstaller --onefile --windowed --name PCAPpullerGUI gui_pcappuller.py
            mv dist/PCAPpullerGUI "release/PCAPpullerGUI-linux"
          fi

      - name: Build DEB/RPM (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ruby-full build-essential rpm
          sudo gem install --no-document fpm
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/usr/local/bin"
          install -m 0755 release/PCAPpullerGUI-linux "$STAGE/usr/local/bin/pcappuller-gui"
          NAME=pcappuller-gui
          DESC="PCAPpuller GUI: fast PCAP window selector, merger, trimmer"
          URL="https://github.com/ktalons/PCAPpuller"
          LICENSE=MIT
          MAINTAINER="Kyle Versluis"
          # deb
          fpm -s dir -t deb -n "$NAME" -v "$VERSION" \
            --license "$LICENSE" --url "$URL" --maintainer "$MAINTAINER" \
            --description "$DESC" \
            -C "$STAGE" --prefix / \
            -p "release/${NAME}_${VERSION}_amd64.deb"
          # rpm
          fpm -s dir -t rpm -n "$NAME" -v "$VERSION" \
            --license "$LICENSE" --url "$URL" --maintainer "$MAINTAINER" \
            --description "$DESC" \
            -C "$STAGE" --prefix / \
            -p "release/${NAME}-${VERSION}-1.x86_64.rpm"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gui-binaries-${{ matrix.os }}
          path: release/*

  sdist-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
          mkdir -p release
          mv dist/* release/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gui-binaries-sdist
          path: release/*

  release:
    needs: [build, sdist-wheel]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: gui-binaries-*
          merge-multiple: true

      - name: Build Analyst Guide PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-recommended texlive-fonts-recommended
          pandoc docs/Analyst-Guide.md -o artifacts/Analyst-Guide.pdf || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          files: artifacts/**

