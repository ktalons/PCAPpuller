name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e ".[datetime,gui]"

      - name: Check tag matches package version
        shell: bash
        run: |
          PKG=$(python -c "import pcappuller; print(pcappuller.__version__)")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pcappuller.__version__ $PKG" >&2
            exit 1
          fi

      # The per-OS scripts under packaging/ are the single source of truth for the build recipe
      # (flags, version stamping, signing, version resource, zip). They read the version from
      # pcappuller.__version__, which the check above pins to the tag, and write into release/.
      - name: Build GUI binary
        shell: bash
        run: |
          set -euxo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -ExecutionPolicy Bypass -File packaging/windows/build_pyinstaller.ps1
          elif [ "$RUNNER_OS" = "macOS" ]; then
            bash packaging/macos/build_pyinstaller.sh
          else
            bash packaging/linux/build_pyinstaller.sh
          fi

      - name: Build DEB/RPM (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ruby-full build-essential rpm
          sudo gem install --no-document fpm
          OUTDIR=release bash packaging/linux/build_fpm.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gui-binaries-${{ matrix.os }}
          path: release/*

  sdist-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
          mkdir -p release
          mv dist/* release/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gui-binaries-sdist
          path: release/*

  release:
    needs: [build, sdist-wheel]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: gui-binaries-*
          merge-multiple: true

      - name: Build Analyst Guide PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-recommended texlive-fonts-recommended
          pandoc docs/Analyst-Guide.md -o artifacts/Analyst-Guide.pdf || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          files: artifacts/**

  notify-tap:
    # Triggers ktalons/homebrew-tap's Update Cask / Update Formula workflows via
    # repository_dispatch (event: pcappuller-release). Runs only after the release and its
    # assets exist, because the tap workflows hash the published assets.
    # GITHUB_TOKEN cannot dispatch to another repo, so this needs HOMETAPDISPATCH:
    # a fine-grained PAT with Contents: read/write on ktalons/homebrew-tap.
    needs: release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Dispatch homebrew-tap bump
        env:
          GH_TOKEN: ${{ secrets.HOMETAPDISPATCH }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::HOMETAPDISPATCH secret is not set; ktalons/homebrew-tap was NOT notified about ${GITHUB_REF_NAME}"
            exit 1
          fi
          gh api --method POST repos/ktalons/homebrew-tap/dispatches \
            -f event_type=pcappuller-release \
            -f "client_payload[tag]=${GITHUB_REF_NAME}"
          echo "Dispatched pcappuller-release tag=${GITHUB_REF_NAME} to ktalons/homebrew-tap"
