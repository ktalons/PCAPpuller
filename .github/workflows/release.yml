name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e ".[datetime,gui]"

      - name: Check tag matches package version
        shell: bash
        run: |
          PKG=$(python -c "import pcappuller; print(pcappuller.__version__)")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pcappuller.__version__ $PKG" >&2
            exit 1
          fi

      - name: Build GUI binary
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Version resource: render packaging/windows/version-info.txt with the release version,
            # then let PyInstaller embed it. A leftover placeholder fails the build.
            VERSION="${GITHUB_REF_NAME#v}"
            IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
            mkdir -p build
            sed -e "s/@VERSION@/${VERSION}/g" \
                -e "s/@VERSION_TUPLE@/${MAJOR}, ${MINOR}, ${PATCH}, 0/g" \
                packaging/windows/version-info.txt > build/version-info.txt
            if grep -q '@' build/version-info.txt; then
              echo "::error::unrendered placeholder in build/version-info.txt"
              exit 1
            fi
            pyinstaller --onefile --windowed --name PCAPpullerGUI \
              --icon assets/PCAPpuller.ico \
              --version-file build/version-info.txt \
              --add-data "pcappuller/assets/pcappuller.png;pcappuller/assets" \
              gui_pcappuller.py
            mv dist/PCAPpullerGUI.exe "release/PCAPpullerGUI-windows.exe"
            # Read the resource back so a missing or wrong version fails the build instead of shipping.
            ACTUAL=$(powershell -NoProfile -Command "(Get-Item 'release/PCAPpullerGUI-windows.exe').VersionInfo.ProductVersion" | tr -d '\r')
            test "$ACTUAL" = "$VERSION"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            # Build a proper .app so Finder runs it correctly.
            # Bundle identifier matches the zap stanza in the Homebrew cask (ktalons/homebrew-tap).
            pyinstaller --windowed --name PCAPpullerGUI \
              --osx-bundle-identifier com.ktalons.PCAPpuller \
              --icon assets/PCAPpuller.icns \
              --add-data "pcappuller/assets/pcappuller.png:pcappuller/assets" \
              gui_pcappuller.py
            # PyInstaller's CLI can't set the bundle version (only a .spec can), so stamp it here.
            # Info.plist is covered by the ad-hoc seal PyInstaller applies, so re-sign afterwards,
            # then verify the seal and the value so a bad bundle fails the build instead of shipping.
            APP=dist/PCAPpullerGUI.app
            VERSION="${GITHUB_REF_NAME#v}"
            plutil -replace CFBundleShortVersionString -string "$VERSION" "$APP/Contents/Info.plist"
            plutil -replace CFBundleVersion -string "$VERSION" "$APP/Contents/Info.plist"
            codesign --force --sign - "$APP"
            codesign --verify --deep --strict "$APP"
            test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
            # -y keeps the symlinks inside Python.framework. Without it zip flattens them into copies,
            # which bloats the bundle and breaks strict signature verification after unpacking.
            (cd dist && zip -ry ../release/PCAPpullerGUI-macos.zip PCAPpullerGUI.app)
          else
            pyinstaller --onefile --windowed --name PCAPpullerGUI \
              --add-data "pcappuller/assets/pcappuller.png:pcappuller/assets" \
              gui_pcappuller.py
            mv dist/PCAPpullerGUI "release/PCAPpullerGUI-linux"
          fi

      - name: Build DEB/RPM (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ruby-full build-essential rpm
          sudo gem install --no-document fpm
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/usr/local/bin"
          install -m 0755 release/PCAPpullerGUI-linux "$STAGE/usr/local/bin/pcappuller-gui"
          NAME=pcappuller-gui
          DESC="PCAPpuller GUI: fast PCAP window selector, merger, trimmer"
          URL="https://github.com/ktalons/PCAPpuller"
          LICENSE=MIT
          MAINTAINER="Kyle Versluis"
          # deb
          fpm -s dir -t deb -n "$NAME" -v "$VERSION" \
            --license "$LICENSE" --url "$URL" --maintainer "$MAINTAINER" \
            --description "$DESC" \
            -C "$STAGE" --prefix / \
            -p "release/${NAME}_${VERSION}_amd64.deb"
          # rpm
          fpm -s dir -t rpm -n "$NAME" -v "$VERSION" \
            --license "$LICENSE" --url "$URL" --maintainer "$MAINTAINER" \
            --description "$DESC" \
            -C "$STAGE" --prefix / \
            -p "release/${NAME}-${VERSION}-1.x86_64.rpm"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gui-binaries-${{ matrix.os }}
          path: release/*

  sdist-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
          mkdir -p release
          mv dist/* release/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gui-binaries-sdist
          path: release/*

  release:
    needs: [build, sdist-wheel]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: gui-binaries-*
          merge-multiple: true

      - name: Build Analyst Guide PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-recommended texlive-fonts-recommended
          pandoc docs/Analyst-Guide.md -o artifacts/Analyst-Guide.pdf || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          files: artifacts/**

  notify-tap:
    # Triggers ktalons/homebrew-tap's Update Cask / Update Formula workflows via
    # repository_dispatch (event: pcappuller-release). Runs only after the release and its
    # assets exist, because the tap workflows hash the published assets.
    # GITHUB_TOKEN cannot dispatch to another repo, so this needs HOMETAPDISPATCH:
    # a fine-grained PAT with Contents: read/write on ktalons/homebrew-tap.
    needs: release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Dispatch homebrew-tap bump
        env:
          GH_TOKEN: ${{ secrets.HOMETAPDISPATCH }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::HOMETAPDISPATCH secret is not set; ktalons/homebrew-tap was NOT notified about ${GITHUB_REF_NAME}"
            exit 1
          fi
          gh api --method POST repos/ktalons/homebrew-tap/dispatches \
            -f event_type=pcappuller-release \
            -f "client_payload[tag]=${GITHUB_REF_NAME}"
          echo "Dispatched pcappuller-release tag=${GITHUB_REF_NAME} to ktalons/homebrew-tap"
